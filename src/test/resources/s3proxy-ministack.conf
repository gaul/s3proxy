s3proxy.endpoint=http://127.0.0.1:0
s3proxy.secure-endpoint=https://127.0.0.1:0
#s3proxy.service-path=s3proxy
# authorization must be aws-v2, aws-v4, aws-v2-or-v4, or none
s3proxy.authorization=aws-v2-or-v4
s3proxy.identity=local-identity
s3proxy.credential=local-credential
s3proxy.keystore-path=keystore.jks
s3proxy.keystore-password=password

jclouds.provider=aws-s3
jclouds.identity=remote-identity
jclouds.credential=remote-credential
# MiniStack answers to 4566 as LocalStack does, and is given a port of its
# own here because the tests tell the two apart by port and nothing else:
# both are the aws-s3 provider.  To them 4566 means a backend that refuses
# the conditional delete, the conditional CompleteMultipartUpload and the
# If-Match "*" wildcard, none of which is true of MiniStack.
jclouds.endpoint=http://127.0.0.1:4567
# Region may be needed by the backend to locate the bucket (default: us-east-1)
jclouds.region=us-east-1
# Conditional writes mode: "native" (default) or "emulated"
s3proxy.aws-s3.conditional-writes=native
