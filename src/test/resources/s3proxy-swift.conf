s3proxy.endpoint=http://127.0.0.1:0
s3proxy.secure-endpoint=https://127.0.0.1:0
#s3proxy.service-path=s3proxy
# authorization must be aws-v2, aws-v4, aws-v2-or-v4, or none
s3proxy.authorization=aws-v2-or-v4
s3proxy.identity=local-identity
s3proxy.credential=local-credential
s3proxy.keystore-path=keystore.jks
s3proxy.keystore-password=password

jclouds.provider=openstack-swift
# Swift's own tempauth, which the all-in-one image runs; the storage URL comes
# back with the token.  A Keystone deployment takes its auth URL here instead
# (e.g. http://127.0.0.1:5000/v3), which the version in the path selects.
jclouds.endpoint=http://127.0.0.1:8080/auth/v1.0
# tempauth names a user "account:user", the account being the project below.
jclouds.identity=tester
jclouds.credential=testing
openstack-swift-sdk.project-name=test
openstack-swift-sdk.user-domain-name=Default
openstack-swift-sdk.project-domain-name=Default
