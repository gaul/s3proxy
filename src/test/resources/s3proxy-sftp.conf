s3proxy.endpoint=http://127.0.0.1:0
s3proxy.secure-endpoint=https://127.0.0.1:0
#s3proxy.service-path=s3proxy
# authorization must be aws-v2, aws-v4, aws-v2-or-v4, or none
s3proxy.authorization=aws-v2-or-v4
s3proxy.identity=local-identity
s3proxy.credential=local-credential
s3proxy.keystore-path=keystore.jks
s3proxy.keystore-password=password

jclouds.provider=sftp
# SftpTestServerListener starts an embedded SFTP server on this endpoint
# with the sftp-test-host-key resource whenever this configuration drives
# the tests.
jclouds.endpoint=sftp://127.0.0.1:2222/
jclouds.identity=sftp-user
jclouds.credential=sftp-password
s3proxy.sftp.basedir=/s3proxy-test
# Fingerprint of sftp-test-host-key; regenerate with:
# ssh-keygen -lf sftp-test-host-key.pub -E sha256
s3proxy.sftp.host-key=SHA256:gsTD37ACDfUTGzfXVZyWDXHWbAk19/HnEd0q7Au78XE
