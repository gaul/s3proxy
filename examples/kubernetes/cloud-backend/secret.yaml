apiVersion: v1
kind: Secret
metadata:
  name: s3proxy-credentials
  labels:
    app.kubernetes.io/name: s3proxy
type: Opaque
stringData:
  # Credentials S3 clients present to the proxy.
  s3proxy-identity: local-identity
  s3proxy-credential: local-credential
  # Credentials the proxy presents to the storage backend.
  jclouds-identity: remote-identity
  jclouds-credential: remote-credential
